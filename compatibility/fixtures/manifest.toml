# Model fixture register.
#
# Hand-maintained. Declares which fixtures must exist, what each one is,
# and where it came from. Checksums are NOT here: `tomllib` reads TOML and
# the standard library cannot write it, so the computed half lives in
# `checksums.json`, which `tools/model_fixture_manifest.py --write`
# produces. This file says what is owed; that file says what is there.
#
# Read `README.md` in this directory before adding a row. The rule that
# governs everything here is that a fixture is never regenerated.

schema_version = 1

# "declared" until every row's files exist and checksums.json covers them.
# `tools/model_fixture_manifest.py --write` is what moves it to "verified",
# and it has not been run.
status = "declared"

# The stem of every fixture is `<stem>.mbst`, `<stem>.input.tsv`, and
# `<stem>.expected.tsv`, all three relative to this directory.
suffixes = { model = ".mbst", input = ".input.tsv", expected = ".expected.tsv" }

# Facts a model file may carry. A row's `carries` list is the subset its
# format version and its training actually recorded; everything absent from
# the list must read back as absent (migration rule R2) and must raise
# rather than return a plausible number when asked for (rule R3).
known_facts = [
    "missing_routing",
    "node_covers",
    "split_gains",
    "monotone",
    "categorical",
    "feature_names",
]

# ---------------------------------------------------------------------
# v1. The oldest format. No missing routing, no covers, no gains, and no
# optional sections at all.
# ---------------------------------------------------------------------

[[fixture]]
id = "v1/single_regression"
stem = "v1/single_regression"
model_format_version = 1
kind = "objective"
num_class = 1
objective = "regression"
n_features = 3
n_trees = 2
carries = []
status = "declared"
proves = "the oldest format still loads and predicts; no fact beyond the tree structure survives from it"

[fixture.provenance]
kind = "synthetic"
authored_from = "src/mojotrees/serialize.mojo version history, v1 entry"
authored_by = "compatibility lane, remaining round task 13"
produced_at = ""
note = "Model the token stream on the hand-written file in tests/test_missing.mojo:test_v1_file_still_loads_and_routes_nothing, which is the only v1 file the repository has ever built."

