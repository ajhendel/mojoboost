# Handoffs to the jobs that would test what they claim.
#
# Every handoff in `handoffs/` was written by a lane that did not run anything,
# or ran one script. Each one therefore ends with a set of claims and a set of
# patches for other people's files. This manifest answers the coordinator's
# question: given that I just applied the patches from handoff X, what is the
# smallest thing I should run?
#
# Two kinds of entry.
#
#   [[handoff]]  a file that exists in handoffs/ today
#   [[lane]]     a lane of the current parallel round whose handoff may not be
#                written yet. `path` is where it will land. The planner reports
#                a missing lane file as pending rather than as an error, because
#                a lane that has not finished is not a broken manifest.
#
# `--self-check` fails on a [[handoff]] path that does not exist, and prints, but
# does not fail on, any file in handoffs/ that no entry names. New handoffs land
# in this repository faster than anything else in it.
#
# ---------------------------------------------------------------------------
# The handoff directory was retired
#
# Commit 21ff9fa, "Remove obsolete handoff documents", deleted handoffs/. Every
# [[handoff]] path below therefore names a file that is no longer in the tree,
# and the rule in the paragraph above would make --self-check emit 42 failures
# for one decision somebody made on purpose. A check that cries about a
# deliberate deletion is a check people learn to skip, and the day it reports a
# real staleness nobody reads it.
#
# So [archive] below declares the retirement, and the planner reports a missing
# [[handoff]] path as retired, in one note, when the prefix matches. Two things
# are deliberately preserved by keeping the entries rather than deleting them.
#
# The mapping is the durable part. "You applied the leaf-batching work, run
# these jobs" is still the right answer whether or not the memo that requested
# it is on disk; the memo was the transient artifact and the job list was not.
#
# And a restored file still works. An entry whose path comes back is checked
# again exactly as before, with no edit here, because the rule keys on the file
# being absent and not on the entry being disbelieved.
#
# A [[handoff]] outside the retired prefix, or one inside it whose file exists
# and is wrong, still fails. Retirement suppresses one specific known-absent
# case and nothing else.
# ---------------------------------------------------------------------------

schema = 1

[archive]
retired = true
prefix = "handoffs/"
commit = "21ff9fa"
title = "Remove obsolete handoff documents"
note = "Paths under this prefix that are absent are reported as retired rather than as failures. Delete this table the day handoffs/ comes back as a live directory, and the 42 entries below start failing again until they are pruned to what exists."

# ---------------------------------------------------------------------------
# GPU algorithms and the Apple lane
# ---------------------------------------------------------------------------

[[handoff]]
paths = [
    "handoffs/algorithm_22_leaf_batching.md",
    "handoffs/algorithm_24_levelwise.md",
    "handoffs/algorithm_26_multiclass_batch.md",
    "handoffs/algorithm_27_hybrid_scheduler.md",
]
jobs = ["native:compile-package"]
escalate = ["differential:backend-equivalence", "differential:gpu-training", "hardware:gpu-suites"]
note = "Every module these four lanes wrote is in the gap list in subsystems.toml: no suite imports gpu_leaf_batching, gpu_levelwise, gpu_multiclass_batch, hybrid_leaf_scheduler, or levelwise_policy. A compile is the only focused evidence available until a caller and a suite exist. The escalations become the right answer the moment one of these is wired into the grower."

[[handoff]]
paths = ["handoffs/algorithm_23_fused_round.md"]
jobs = ["differential:gpu-training", "native:gpu-active-rows"]
escalate = ["differential:backend-equivalence", "hardware:gpu-validate"]
note = "The fused round touches objective, sampling, and the root histogram in one pass, so the equivalence job is the one that would notice a fusion that changed an answer."

[[handoff]]
paths = ["handoffs/algorithm_25_binned_layout.md"]
jobs = ["native:compile-package"]
escalate = ["differential:gpu-strategies", "differential:backend-equivalence"]

[[handoff]]
paths = ["handoffs/apple_a1_active_rows.md"]
jobs = ["native:gpu-active-rows"]
escalate = ["differential:gpu-training"]
note = "Order preservation is the property; native:gpu-active-rows asserts it."

[[handoff]]
paths = ["handoffs/apple_a2_split_search.md"]
jobs = ["native:gpu-split-search"]
escalate = ["differential:backend-equivalence", "native:monotone", "native:categorical"]

[[handoff]]
paths = ["handoffs/apple_a3_objectives.md", "handoffs/migration_21_objective_metric_registry.md"]
jobs = ["native:gpu-objectives-native", "native:objectives"]
escalate = ["differential:gpu-objectives", "native:metrics", "python:eval-set"]

[[handoff]]
paths = ["handoffs/apple_a4_gpu_predict.md", "handoffs/connect_06_gpu_prediction_bindings.md"]
jobs = ["native:gpu-predict"]
escalate = ["python:predict", "differential:backend-equivalence"]
note = "The bindings half of this needs python:build-ext first, and the parity contract holds GPU prediction at partial precisely because the predict binding takes no device."

[[handoff]]
paths = ["handoffs/apple_a5_runtime.md"]
jobs = ["native:gpu-runtime"]
escalate = ["differential:gpu-strategies", "hardware:gpu-validate"]

[[handoff]]
paths = ["handoffs/apple_a6_policy.md", "handoffs/performance_14_gpu_histogram.md"]
jobs = ["native:apple-gpu-policy", "differential:gpu-tiling"]
escalate = ["hardware:hist-strategy-sweep", "hardware:apple-suite-smoke"]
note = "A tuning policy that is wrong is slow, not incorrect, so the correctness jobs will pass either way. Only a hardware sweep can tell whether the policy chose well."

[[handoff]]
paths = ["handoffs/apple_a7_unified_memory.md", "handoffs/performance_18_unified_memory.md"]
jobs = ["native:compile-package"]
escalate = ["hardware:apple-suite-smoke", "hardware:thermal"]
note = "unified_memory_policy.mojo is imported by no suite. Both lanes state plainly that nothing was compiled or run."

[[handoff]]
paths = ["handoffs/apple_a8_benchmarks.md", "handoffs/performance_17_thermal_energy.md"]
jobs = ["static:apple-selfcheck", "static:thermal-plan"]
escalate = ["static:apple-plan", "hardware:apple-suite-smoke", "hardware:thermal"]

[[handoff]]
paths = ["handoffs/apple_a9_device_selection.md", "handoffs/migration_20_device_policy.md", "handoffs/connect_05_device_policy.md"]
