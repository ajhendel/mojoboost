[[handoff]]
paths = ["handoffs/apple_a10_demo.md", "handoffs/release_04_install_ux.md"]
jobs = ["smoke:install-example"]
escalate = ["smoke:wheel-surface", "wheel:clean-install-macos"]

[[handoff]]
