# Every validation command this repository can issue, one entry each.
#
# This file is the answer to "what is the smallest command that would tell me
# whether the thing I just changed still works". Nothing here has been executed
# by the lane that wrote it. `provenance` says, per job, how much anyone knows
# about the command working at all:
#
#   ci          a job in .github/workflows runs this exact command
#   documented  a file in this repository records the command and what it does
#   unverified  this file composed the command from a documented pattern, and
#               nobody has run that composition
#
# `budget_seconds` is a scheduling guess, not a measurement. See tiers.toml.
#
# Fields, all optional except id, tier, title, and one of command or blocked:
#
#   id                tier-prefixed, unique, stable. Referenced by
#                     subsystems.toml and handoffs.toml.
#   tier              a tier id from tiers.toml
#   command           the shell command, run from the repository root
#   env               table of environment variables the command needs
#   budget_seconds    what the planner charges against the machine budget
#   timeout_seconds   wall clock ceiling the emitted script enforces
#   threads           value for MOJOTREES_NUM_WORKERS
#   exclusive         "", "cpu", "gpu", or "build"; overrides the tier
#   needs             preconditions: toolchain, extension, wheel, gpu, numpy,
#                     pytest, network, two-hosts, sudo, outside-pixi
#   depends_on        job ids that must have passed first
#   requires_files    repository paths the command reads or executes
#   provenance        ci | documented | unverified
#   proves            one sentence, required, checked non-empty by --self-check
#   evidence          where the output belongs when it is evidence
#   broad             true for a whole-suite or sweep job
#   blocked           true when no command exists yet
#   blocked_reason    why, and what would unblock it

schema = 1

[defaults]
timeout_seconds = 900
threads = 4

[defaults.budget_seconds]
static = 5
smoke = 15
native = 60
python = 45
differential = 120
wheel = 300
distributed = 60
hardware = 1800
broad = 1200

