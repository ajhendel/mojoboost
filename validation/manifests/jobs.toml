# Listed rather than omitted so the gap has an entry instead of a silence,
# which is the same reason distributed:two-process is here. The suite exists
# on disk and no pixi task runs it, so it has never run in CI and running it
# by hand is not what this planner is for: a job whose command is not the
# repository's own entry point would be this file inventing a way to run a
# test, and the next person would not find it from pixi.toml. Patch P4 in
# handoffs/remaining_14_validation_plan.md adds it to the test chain, at which
# point this entry becomes an ordinary native job.
#
# tools/check_parity.py does not catch this one. Its unwired-suite check reads
# suites cited in docs/LIGHTGBM_PARITY.md, and nothing cites this file, so an
# uncited suite that no task runs passes both checks. --self-check now catches
# the mirror case (a suite the chain runs that no job names); this direction is
# reported by --coverage.
[[job]]
id = "native:gpu-split-policy"
tier = "native"
title = "GPU split policy"
