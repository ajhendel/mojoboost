# selection and once through the full sort, by moving
# MOJOTREES_BINNING_SELECT_MIN_ROWS, and asserts the two agree edge for edge.
# So one job covers both implementations and there is no second entry for the
# sort path. It also sweeps worker counts, which is why it is dearer than a
# native job's default guess.
