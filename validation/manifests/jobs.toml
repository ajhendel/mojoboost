[[job]]
id = "static:parity"
tier = "static"
title = "LightGBM parity contract"
command = "python3 tools/check_parity.py"
requires_files = ["tools/check_parity.py", "docs/LIGHTGBM_PARITY.md", "docs/CAPABILITY_LEVELS.md"]
provenance = "ci"
proves = "That every supported row, cited path, watched symbol, and capability level in the contract still matches the tree."
evidence = "docs/LIGHTGBM_PARITY.md"

[[job]]
id = "static:matrix"
