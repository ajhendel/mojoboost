# Changed paths to the smallest jobs that would notice.
#
# A subsystem is a set of paths that fail together. When one of its paths
# changes, `jobs` is the smallest set of commands that would catch the failure,
# and `escalate` is what to add when the change is one you are unsure about.
# The planner never schedules `escalate` on its own; it prints it as the next
# thing to consider.
#
# How the `jobs` lists were derived. Every Mojo suite in `tests/` was parsed for
# its `from mojotrees.<module> import` lines, which gives, per module, the exact
# set of suites that import it. Where that set is small, it is the job list.
# Where it is large (`boosting.mojo` is imported by 22 suites, `tree.mojo` by
# 20), a representative subset is listed and `escalate` carries the rest, on the
# grounds that a list of 22 commands is not a focused plan. The derivation is
# reproducible: see docs/FOCUSED_VALIDATION_PLAN.md section 3.
#
# A suite that imports a module only transitively is deliberately NOT counted.
# `gain.mojo` is reached by 34 of the 47 suites through `boosting.mojo`, which
# makes "everything" the answer for almost every module and makes the mapping
# useless. Transitive reach means the module still has to compile, and a
# compile check is what `native:compile-package` is for.
#
# Matching: a path entry matches literally, as an fnmatch pattern, or as a
# directory prefix when it ends in `/`. A changed file under `tests/` or
# `python/tests/` needs no entry here: the planner resolves it against the
# `requires_files` of the job that runs it.

schema = 1

# ---------------------------------------------------------------------------
# Native core
# ---------------------------------------------------------------------------

[[subsystem]]
id = "core-boosting"
title = "The boosting loop, the model, and the tree"
paths = [
    "src/mojotrees/boosting.mojo",
    "src/mojotrees/model.mojo",
    "src/mojotrees/tree.mojo",
    "src/mojotrees/gain.mojo",
    "src/mojotrees/initialization.mojo",
    "src/mojotrees/params.mojo",
    "src/mojotrees/__init__.mojo",
]
jobs = ["native:core", "native:objectives", "native:serialize", "native:regularization"]
escalate = ["broad:full-suite"]
note = "boosting.mojo is imported by 22 suites and tree.mojo by 20. A change here is the one case where the broad suite is the honest answer."

[[subsystem]]
id = "binning"
title = "Binning and dataset construction"
paths = [
    "src/mojotrees/binning.mojo",
    "src/mojotrees/trainset.mojo",
    "src/mojotrees/raw_data.mojo",
]
jobs = ["native:binning", "native:sparse", "native:kernels", "native:trainset", "native:histogram-reference"]
escalate = ["native:categorical", "native:missing", "native:continued"]
note = "Bin boundaries move every downstream number, so the histogram reference is part of the minimum here rather than an escalation. native:binning is the only suite that imports mojotrees.binning directly and it was missing from this list until it was noticed by hand. native:sparse was promoted out of the escalations for a demonstrated reason rather than a suspected one: sparse.fit_bins_csc reimplements the rank walk over an implied dense column, so a rule added to the dense binner and not to that one makes the two disagree, and test_sparse_binning_matches_dense_exactly is the only thing in the tree that notices. It caught exactly that on 2026-08-14, when the level rule landed dense-only. A change to binning.mojo that does not touch sparse.mojo is precisely the change this catches, so it cannot be an escalation the operator has to remember to ask for."

[[subsystem]]
id = "histogram-cpu"
title = "CPU histogram construction and the parallel runtime"
paths = [
    "src/mojotrees/histogram.mojo",
    "src/mojotrees/parallel.mojo",
    "src/mojotrees/histogram_cache_policy.mojo",
]
jobs = ["native:histogram-reference", "native:cpu-parallel", "native:binning"]
escalate = ["differential:threads-1", "differential:threads-max", "broad:bench-threshold"]
note = "The two thread-count jobs are the ones that catch a race that only shows up at one worker count. native:binning is in the minimum because parallel.mojo is a dispatch library whose shapes are used, not tested, by the file that defines them: dispatch_feature_rows has exactly one caller, BinMapper.transform, and the suite that sweeps worker counts over it and compares every cell against the serial run is the binning one. test_cpu_parallel covers the dispatch helpers' own arithmetic and would not notice a tiling that dropped a row block."

[[subsystem]]
id = "split"
title = "Split selection and constraints"
paths = [
    "src/mojotrees/split.mojo",
    "src/mojotrees/monotone.mojo",
    "src/mojotrees/interaction.mojo",
]
jobs = ["native:kernels", "native:monotone", "native:interaction"]
escalate = ["native:gpu-split-search", "differential:backend-equivalence"]
note = "gpu_split_search.mojo reimplements this rule on the device, so a rule change here is a two-sided change."

