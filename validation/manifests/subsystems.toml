note = "native:binning is here for the same reason native:sparse is in the binning subsystem, in the other direction: sparse.fit_bins_csc is required to produce the edges binning.fit_bins produces, so a change on either side of that pair has to run both. The Python side of this chain is guarded by pytest.importorskip('scipy.sparse') and the pytest environment installs no scipy, so those escalations skip themselves today. See docs/FOCUSED_VALIDATION_PLAN.md section 7."

