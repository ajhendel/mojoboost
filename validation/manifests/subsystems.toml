# ---------------------------------------------------------------------------
# Gaps: paths with no focused job at all
#
# These 18 modules are imported by no Mojo suite, directly or transitively.
# Editing one of them is not covered by anything in the native tier, and the
# planner says so rather than falling back to a suite that would not notice.
# `native:compile-package` is the honest floor: it proves the module still
# type-checks and nothing more.
#
# A gap entry may name a path that a subsystem above also names, and several do.
# That is not a contradiction and the planner treats it as neither: it schedules
# the subsystem's jobs AND prints the gap warning, because "this subsystem has
# jobs" and "none of those jobs import the file you changed" are both true and
# the second one is the one that gets forgotten.
#
# This list is the same fact `tools/check_parity.py` records from the other
# side, where six of these modules are watched by the public name an integrator
# would have to export to reach them. A module leaving this list is a module
# that gained a caller and a suite, which is exactly the event both files exist
# to notice.
# ---------------------------------------------------------------------------

[[gap]]
paths = [
    "src/mojotrees/alternate_boosting.mojo",
    "src/mojotrees/boosting_dart.mojo",
    "src/mojotrees/boosting_rf.mojo",
]
fallback = ["native:compile-package"]
reason = "Alternative boosting modes. No trainer calls them and no suite imports them."
would_close_it = "A suite under tests/ that imports the module, plus a trainer that calls it. Until both exist, a passing compile is the whole of the evidence."

[[gap]]
paths = ["src/mojotrees/class_weight.mojo"]
fallback = ["native:compile-package"]
reason = "Class weighting. No suite imports it."
would_close_it = "Reaching it from fit(class_weight=) and asserting the weighted gradient in tests/test_weights.mojo."

[[gap]]
paths = [
    "src/mojotrees/gpu_bin_packing.mojo",
    "src/mojotrees/gpu_binned_layout.mojo",
    "src/mojotrees/gpu_categorical.mojo",
    "src/mojotrees/gpu_sparse.mojo",
    "src/mojotrees/gpu_sparse_layout.mojo",
]
fallback = ["native:compile-package"]
reason = "GPU data layouts. No suite imports them. The sparse GPU path raises for device='gpu' today, so there is nothing to run even if a suite existed."
would_close_it = "A layout suite that builds each layout from a fixture and compares it to the CPU layout, in the shape of tests/test_histogram_reference.mojo."

[[gap]]
paths = [
    "src/mojotrees/gpu_leaf_batching.mojo",
    "src/mojotrees/gpu_levelwise.mojo",
    "src/mojotrees/gpu_multiclass_batch.mojo",
    "src/mojotrees/hybrid_leaf_scheduler.mojo",
    "src/mojotrees/levelwise_policy.mojo",
    "src/mojotrees/histogram_cache_policy.mojo",
]
fallback = ["native:compile-package"]
reason = "Scheduling policies. Pure arithmetic over device limits, imported by no suite."
would_close_it = "A policy suite in the shape of tests/parallel/test_apple_gpu_policy.mojo, which is the one policy module that does have one. These are the cheapest gaps in this file to close: they need no accelerator."

[[gap]]
paths = [
    "src/mojotrees/gpu_backend_policy.mojo",
    "src/mojotrees/gpu_portability.mojo",
]
fallback = ["native:compile-package", "differential:gpu-portability"]
reason = "Backend selection and the portability contract. No suite imports either module; tests/test_gpu_portability.mojo checks the kernels against the contract rather than the modules that state it."
would_close_it = "Asserting the policy's choice for a table of device capability records."

[[gap]]
paths = [
    "src/mojotrees/inspection.mojo",
    "src/mojotrees/model_dump.mojo",
]
fallback = ["native:compile-package", "python:inspection"]
reason = "No Mojo suite imports either. Their reachable behavior is covered from Python, one layer up, and split_gains has no binding at all."
would_close_it = "A bindings function for split_gains, after which python:inspection would stop reporting has_split_gain false. Named in handoffs/integration_09_parity.md section 3 item 6."
