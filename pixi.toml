[workspace]
authors = ["Andrew Hendel <ajhendel@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojotrees"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0a4"

[tasks]
# Build flags, and why this file sets none of them.
#
# Read from `mojo build --help` and `mojo build --print-effective-target` on
# Mojo 1.0.0 rather than assumed from clang, because the toolchain's defaults
# are not clang's:
#
#   * `--optimization-level` defaults to **3**. There is no missing `-O3`.
#   * `--target-cpu` and `--target-features` default to the **host**. On the
#     M4 this resolves to `--target-cpu apple-m4` with `+sme2,+i8mm,+bf16,
#     +dotprod,+fullfp16` and the rest of the chip's feature set. So every
#     `mojo build` and `mojo run` named below is already a native build, and
#     `--mcpu=native` or `--march=native` would only restate the default.
#     Mojo also accepts `--march`, `--mcpu`, `--mtune`, `--target-triple`,
#     `--target-features` and `--target-accelerator`; none is needed to get
#     host codegen, because host codegen is what you get by omitting them.
#   * `--fp-mode contract=fast` is the **default**, and it fuses `a + b*c`
#     into an FMA across statements. `contract=off` exists and is not set:
#     turning it off moves bits in every objective, every split gain and
#     every leaf value, so it is a deliberate golden re-baseline rather than
#     a build-file edit, and it would cost speed rather than buy it.
#   * `mojo precompile` accepts **no codegen flags at all**: no `-O`, no
#     `--target-*`, no `--fp-mode`, no `--march`. Its own help says a
#     `.mojopkg` holds non-elaborated code and is architecture-independent by
#     construction. `build-pkg` below therefore has nothing to tune; codegen
#     happens later, inside whichever `mojo build` or `mojo run` imports it.
#
# The consequence of the host default is a PORTABILITY question rather than a
# speed one, and it does not live in this file. `bindings/build.sh`,
# `capi/build.sh` and `cli/build.sh` emit real machine code and pass no target
# flags, so a shipped extension is compiled for the CPU of whatever machine or
# CI runner built it. A baseline (`--target-cpu x86-64-v2` and an ARM
# equivalent) belongs in those scripts, not here, and is not this file's to
# set. `print-target` records what a given machine actually resolved to, which
# is the fact a benchmark result or a wheel provenance line should carry.
print-target = "mojo build --print-effective-target"

# Precompile the package once.  Every test then runs against `-I build`
# instead of recompiling all sixty modules of `src/mojotrees` inside its own
# process, and precompiling is a stricter check than the suite is: it
# elaborates every module, including the ones no test imports.
# `mkdir -p build` is not decoration: `build/` is gitignored and `mojo
# precompile` will not create its own output directory, so on a fresh clone
# this task failed with "cannot open output file
# 'build/mojotrees.mojopkg': No such file or directory". It survived because
# every development machine already had the directory lying around from an
# earlier run. Found on a clean RunPod clone, 2026-08-18.
# `tools/run_tests.sh` already does this at its own precompile site, which is
# why `test` and `test-gpu` never hit it.
build-pkg = "mkdir -p build && mojo precompile -I src src/mojotrees -o build/mojotrees.mojopkg"

# One package build, then a bounded pool of test processes, with every
# failure reported rather than the first one aborting the run.  These were
# sixty `mojo run` commands chained with `&&`; `tools/run_tests.sh` explains
# what that cost.  The runner discovers `tests/test_*.mojo` by glob, so a new
# test file is picked up by writing it, which the chains did not do:
# `test_gpu_split_policy.mojo` sat in the tree passing and named by no task.
test = "bash tools/run_tests.sh all"
# CPU-only CI must not instantiate accelerator kernels merely to discover at
# compile time that its runner has no GPU architecture.  The accelerator list
# lives in `tools/run_tests.sh`; this is everything else.
test-cpu = "bash tools/run_tests.sh cpu"
test-gpu = "bash tools/run_tests.sh gpu"
# Print the selection without running it.
test-list = "bash tools/run_tests.sh list"

# The cheap gates. Every one of these is standard-library Python reading
# files already in the tree: no Mojo compile, no extension build, no
# benchmark, no network. That is what makes them safe to run on every change
# and on a bare CI runner in seconds, and it is the line to keep. Do not add
# anything to `check-gates` that builds.
#
# Each of the first three owns a generated or checked artifact, and the
# pre-commit hook installed by `install-hooks` runs the owning gate when its
# artifact is staged. That the artifacts drifted at all is why they exist:
# all three have been committed stale because nothing made the gate run.
check-api = "python3 tools/api_snapshot.py --check"
# Checks docs/LIGHTGBM_PARITY.md against the repository. Standard library
# only, and it builds nothing, so it is cheap enough to run on every change.
check-parity = "python3 tools/check_parity.py"
# Checks docs/PORTING.md against `mojotrees.port`, which generates it. Both
# the page and the runtime report come out of one `render()`, so this gate is
# what keeps "generated" from decaying into "transcribed once".
check-port-doc = "python3 tools/port_report.py --check"
# Checks pixi.toml itself: every path a task names, every `-I` directory,
# every suite handed to run_tests.sh, every depends-on, every environment.
check-pixi = "python3 tools/check_pixi_tasks.py"
check-connectivity = "python3 tools/connectivity_audit.py"
check-integration = "python3 tools/audit_integration.py"
# The CPU-only build guard audit. An accelerator machine cannot reproduce
# `Unknown GPU architecture detected`, so this enumerates the reachable GPU
# APIs instead of waiting for CI to find the next one. Reads the tree as
# text; builds nothing. See docs/design/CPU_ONLY_BUILD_AUDIT.md.
check-gpu-guards = "python3 tools/check_gpu_guards.py"
# All of the above, every one run even when an earlier one fails, so the
# report is the whole state rather than the first thing that broke.
check-gates = "bash tools/check_gates.sh"

# Installs the pre-commit hook that refuses a stale gate artifact. It is a
# shim into tools/hooks/pre-commit, so the behavior stays versioned.
# `bash tools/install_hooks.sh --uninstall` removes it.
install-hooks = "bash tools/install_hooks.sh"

bench = "mojo run -I src bench/bench_train.mojo"
bench-canary = "bash tools/with_timeout.sh auto mojo run -I src bench/bench_canary.mojo"
bench-hist = "mojo run -I src bench/bench_histogram.mojo"
bench-hist-scaling = "mojo run -I src bench/bench_histogram_scaling.mojo"
bench-train-gpu = "bash tools/with_timeout.sh auto mojo run -I src bench/bench_train_gpu.mojo"
# The sparse crossover (w4_sparse), interleaved the same way. Separate from
# bench-train-gpu because the sparse arms take a SparseBinnedMatrix and have
# no split-search strategy to choose. See bench/README.md for the protocol.
bench-train-gpu-sparse = "bash tools/with_timeout.sh auto mojo run -I src bench/bench_train_gpu_sparse.mojo"
gpu-validate = "bash tools/with_timeout.sh auto mojo run -I src bench/bench_gpu_validation.mojo"
bench-threshold = "mojo run -I src bench/bench_threshold.mojo"
# The CPU bin-layout A/B: feature-major against row-major against the timed
# `auto` rule, with LightGBM as the in-process anchor, arms interleaved.
# Needs the bench environment for the LightGBM arm; run it as
# `pixi run -e bench bench-cpu-bin-layout 799110 100 12`.
bench-cpu-bin-layout = "mojo run -I src bench/bench_cpu_bin_layout.mojo"
# The serial-histogram-kernel A/B: four spellings of the inner scatter plus
# LightGBM, arms interleaved in one process, bitwise model digest per arm.
# Needs the bench environment for the LightGBM arm, and takes the worker
# count from `MOJOTREES_NUM_WORKERS` on both engines, so the one-thread and
# the ten-thread readings are two invocations of the same line:
# `MOJOTREES_NUM_WORKERS=1 pixi run -e bench bench-serial-kernel 799110 100 12`.
bench-serial-kernel = "mojo run -I src bench/bench_serial_kernel.mojo"
bench-sparse = "mojo run -I src bench/bench_sparse.mojo"
bench-profile = "mojo run -I src bench/bench_profile.mojo"
bench-custom = "mojo run -I src bench/bench_custom_objective.mojo"
bench-goss = "mojo run -I src bench/bench_goss.mojo"
# What one kernel launch and one host wait cost here. Read this before
# proposing any GPU change whose whole benefit is fewer launches or fewer
# synchronizations; see train_gpu.mojo's `_device_search_resident`.
bench-launch-cost = "bash tools/with_timeout.sh auto mojo run -I src bench/bench_launch_cost.mojo"
bench-unified-memory = "mojo run -I src bench/apple/unified_memory.mojo"
build-python = "bindings/build.sh"
test-python = { cmd = "python python/test_python_api.py", depends-on = [
    "build-python",
] }
# The C ABI and the command line tool. `test-capi` and `test-cli` are Mojo
# tests and need no C toolchain; `test-c` compiles capi/test_capi.c against
# the public header and skips itself when no compiler is installed.
build-capi = "capi/build.sh"
build-cli = "cli/build.sh"
test-capi = "bash tools/run_tests.sh cpu test_capi"
test-cli = "bash tools/run_tests.sh cpu test_cli"
test-c = "capi/run_c_tests.sh"

# Device probes. Not benchmarks: a probe asks what one runtime operation costs
# or whether one runtime capability exists, and it gates every answer it gives
# on delivering the right bytes. `probes/readback_cost.mojo` prices one host
# readback of a 136-byte split record against a bare command-buffer completion,
# and reports which transports this MAX version and this backend can reach at
# all. Takes optional `trips trials`.
probe-readback = "bash tools/with_timeout.sh auto mojo run -I src probes/readback_cost.mojo"
# The two MAX-only reproductions written while chasing the CUDA deadlock of
# 2026-08-18. They import NOTHING from this package on purpose: if a hang
# reproduces here it is upstream, and if it does not the cause needs something
# mojotrees does that these primitives do not cover. Both PASS on an RTX 5090,
# which is what moved that diagnosis from "MAX is broken" to "ours, and
# narrower than we thought". See docs/GPU_VALIDATION.md.
probe-cuda-alloc = "bash tools/with_timeout.sh auto mojo run probes/cuda_deadlock_alloc.mojo"
probe-cuda-launch = "bash tools/with_timeout.sh auto mojo run probes/cuda_deadlock_launch.mojo"
probe-cuda-subbuffer = "bash tools/with_timeout.sh auto mojo run probes/cuda_deadlock_subbuffer.mojo"
probe-cuda-parallel = "bash tools/with_timeout.sh auto mojo run probes/cuda_deadlock_parallel.mojo"
probe-cuda-variety = "bash tools/with_timeout.sh auto mojo run probes/cuda_deadlock_kernel_variety.mojo"

[dependencies]
mojo = ">=1.0.0,<2"
max = ">=26.5.0,<27"

[feature.bench.dependencies]
python = ">=3.11"
numpy = "*"
lightgbm = "*"
# bench/real_data/selfcheck.py's categorical fixture needs pandas, and the
# CatBoost adapter needs it to hand CatBoost a mixed float-and-integer frame:
# numpy has no mixed dtype and an object array of a million rows is not a
# container this harness will build. It was declared only under `pytest` and
# passed here by accident, because catboost happens to depend on pandas. An
# accidental dependency is one `catboost` release away from being a missing
# one, and the failure would look like a broken fixture rather than a missing
# declaration.
pandas = "*"
# The CatBoost peer arm of bench/real_data. It is a peer column reported
# beside the comparator and never instead of it: the one comparator is
# LightGBM at stock defaults plus deterministic=true, and nothing is gated
# on CatBoost. 1.2 is the floor because below it the resolved parameter list
# the arm records is not readable back through `get_all_params()`, and a
# record that states defaults nobody checked is worse than one that states
# none. See bench/real_data/scenarios.py, CATBOOST_MIN_VERSION.
catboost = ">=1.2"
# NVIDIA's gbm-bench imports tqdm at module scope in datasets.py for a
# download progress bar. bench/external/ runs that harness unmodified
# apart from three anchored edits, so the dependency is declared here
# rather than stubbed out. See bench/external/README.md.
tqdm = "*"
# The XGBoost peer arm of bench/real_data, added 2026-08-17. It is a peer
# column reported beside the comparator and never instead of it, exactly as
# catboost is: the one comparator is LightGBM at stock defaults plus
# deterministic=true and nothing is gated on XGBoost.
#
# WHY IT WAS ADDED. The `mojotrees_depthwise` arm had nothing external to be
# read against. `grow_policy` with the values depthwise and lossguide is
# XGBoost's parameter, and LightGBM 4.7.0 has no growth-policy switch at all
# (verified three ways: no Python file in the installed package mentions it,
# the compiled dylib contains none of the three strings, and
# src/mojotrees/growth_policy.mojo says so). XGBoost is the library whose
# DEFAULT growth order is the one that arm grows, so it is the only honest
# external reference for it.
#
# 2.0 is the floor, and the reason is that this arm's honesty depends on
# Booster.save_config() returning the RESOLVED configuration. That is what
# lets the arm record what XGBoost actually ran instead of a transcription of
# its documentation, and it is also where every value in
# scenarios.XGBOOST_RESOLVED_DEFAULTS came from, including the ones our
# mojotrees_depthwise arm mirrors. The `device` parameter is the second
# reason: a record naming a backend has to mean one thing across every version
# this floor admits. See bench/real_data/scenarios.py, XGBOOST_MIN_VERSION.
#
# INSTALLED as of 2026-08-17, at 3.4.0, and this paragraph used to say the
# opposite. It said the dependency was DECLARED BUT NOT INSTALLED because the
# environment had not been solved for it, which was true for a few hours on
# the day the arm was written and was left in place after the solve. Three
# things were read out of the installed package rather than assumed, and each
# corrects something this file or the harness had claimed:
#
#   - tree_method resolves to the string "auto", NOT to "hist". The histogram
#     algorithm is what runs and the evidence is the resolved updater,
#     grow_quantile_histmaker. An earlier version of this comment said the
#     floor of 2.0 guaranteed a tree_method of hist; what it guarantees is the
#     updater, and a reader checking the algorithm has to look there.
#   - the conda build is the CPU one (libxgboost-3.4.0-cpu_*), and on this
#     Apple silicon machine a fit passed device="cuda" TRAINS ANYWAY, warning
#     that it changed the device to CPU and resolving `device` to "cpu". So a
#     GPU XGBoost cell would have been a CPU measurement wearing a GPU label,
#     which is why XGBoostEngine.load refuses the device by name rather than
#     leaving the library to refuse it.
#   - XGBRegressor().get_params() returns None for every tree parameter on
#     3.4.0, so the sklearn wrapper is not a source for a default and a fitted
#     booster is the only one.
xgboost = ">=2.0"

[feature.bench.tasks]
bench-lgbm = "python bench/bench_lightgbm.py"
compare-missing = "python bench/compare_missing_lightgbm.py"
compare-categorical = "python bench/compare_categorical_lightgbm.py"
bench-custom-py = "python bench/bench_custom_objective.py"
compare-ranking = "python bench/compare_ranking.py"
# Batch prediction against block count, ours and LightGBM's, interleaved in
# one process. Answers why our predict phases sit at 3.3 effective cores on a
# 10-core M4 while the peers reach 8.2 to 8.5, by sweeping the block count
# instead of reading one point: a static split and a small worker pool both
# predict 3.33 at ten blocks and disagree everywhere else. Needs LightGBM for
# its second half, which is the busy-wait check, hence this environment. See
# the file's docstring for the three hypotheses and how the curve separates
# them.
predict-thread-sweep = "python bench/real_data/predict_thread_sweep.py"
# The numeric differential against LightGBM for the features whose parity
# rows say `partial` only because no differential has ever run. Needs both
# libraries, hence this environment. See docs/DIFFERENTIAL_TESTING.md.
lgbm-differential = "python tools/lgbm_differential.py"

[feature.pkg.dependencies]
python-build = "*"
setuptools = ">=77"
wheel = "*"
pip = "*"
twine = "*"

[feature.pkg.tasks]
build-wheel = "packaging/build_wheel.sh"
test-wheel = { cmd = "packaging/test_wheel.sh", depends-on = ["build-wheel"] }

[feature.pytest.dependencies]
pytest = "*"
scikit-learn = "*"
pandas = "*"
pyarrow = "*"
polars = "*"
# Declared rather than inherited. scipy already arrives here as a
# scikit-learn dependency, so the five suites that guard their sparse cases
# with `pytest.importorskip("scipy.sparse")` do run today. They run by
# accident. The moment scikit-learn stops depending on scipy, or the solver
# picks a build that does not, those cases start skipping and CI keeps
# reporting green on a path it no longer executes. A skip is silent, which
# is what makes this worth a line: the coverage of the CSR and CSC paths
# should rest on a declared dependency, not on somebody else's.
scipy = "*"

# The estimator suite (python/tests) needs pytest, and its scikit-learn,
# pandas, pyarrow, and polars tests skip themselves when those are absent.
# `test-python` above stays dependency-free on purpose, so it also runs
# against a bare wheel install. Run this one with
# `pixi run -e pytest test-estimators`.
[feature.pytest.tasks]
test-estimators = { cmd = "pytest -q python/tests", depends-on = [
    "build-python",
] }

# Per-interpreter build environments, so one source can ship one wheel per
# CPython minor version instead of one wheel for whichever interpreter the
# solver happened to pick.
#
# WHY THESE EXIST. `[dependencies]` above pins no python, so pixi resolved
# `max` to its newest per-interpreter variant and the project inherited 3.14 by
# accident. That accident reached PyPI: 0.1.0a2 and 0.1.0a3 are published as
# `cp314-cp314-macosx_26_0_arm64` and nothing else, so every caller on 3.10
# through 3.13 is refused by tag before `requires-python` is ever consulted.
#
# WHY IT IS SAFE TO ASK FOR. Verified against the channel on 2026-08-18, not
# assumed: `max` 26.5.0 publishes exactly five builds, `3.10release` through
# `3.14release`, on each of osx-arm64, linux-64 and linux-aarch64. Pinning
# python here selects among builds that already exist; it does not ask the
# channel for something it does not have.
#
# 3.10 is the floor and it is measured, not chosen. Below it the extension
# aborts during module initialization on `symbol not found: Py_NewRef`, a
# CPython 3.10 addition, and `mojo` and `mojo-python` both require
# `python >=3.10` independently. docs/PYTHON_SUPPORT.md section 10, run M1b.
#
# There is no free-threaded row and there cannot be one from here: every `max`
# 26.5.0 variant depends on `python-gil`. Only Modular can change that; do not
# work around it.
[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

# Named for symmetry rather than necessity. Without it the release matrix would
# have four explicit rows and one implicit one, and the implicit one is exactly
# the accident this block exists to end.
[feature.py314.dependencies]
python = "3.14.*"

[environments]
bench = ["bench"]
pkg = ["pkg"]
pytest = ["pytest"]

# One per interpreter, each carrying the `pkg` build tooling. The release
# workflow iterates these; `packaging/macos/build_release_wheel.sh` selects one
# through MOJOTREES_PKG_ENV, which defaults to plain `pkg` so a laptop build is
# unchanged.
#
# NOT YET SOLVED. Adding an environment requires `pixi.lock` to be regenerated,
# and this checkout is shared with lanes that are mid-measurement against the
# `bench` environment. Run `pixi lock` at a quiet moment, on purpose, and read
# the diff for movement in the environments that already existed before
# committing it. Until then these rows are declared and unusable, which is the
# honest state and is why no workflow is marked ready by the same change.
pkg-py310 = ["pkg", "py310"]
pkg-py311 = ["pkg", "py311"]
pkg-py312 = ["pkg", "py312"]
pkg-py313 = ["pkg", "py313"]
pkg-py314 = ["pkg", "py314"]
