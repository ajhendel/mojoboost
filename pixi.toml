[workspace]
authors = ["Andrew Hendel <ajhendel@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojotrees"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
# Precompile the package once.  Every test then runs against `-I build`
# instead of recompiling all sixty modules of `src/mojotrees` inside its own
# process, and precompiling is a stricter check than the suite is: it
# elaborates every module, including the ones no test imports.
build-pkg = "mojo precompile -I src src/mojotrees -o build/mojotrees.mojopkg"

# One package build, then a bounded pool of test processes, with every
# failure reported rather than the first one aborting the run.  These were
# sixty `mojo run` commands chained with `&&`; `tools/run_tests.sh` explains
# what that cost.  The runner discovers `tests/test_*.mojo` by glob, so a new
# test file is picked up by writing it, which the chains did not do:
# `test_gpu_split_policy.mojo` sat in the tree passing and named by no task.
test = "bash tools/run_tests.sh all"
# CPU-only CI must not instantiate accelerator kernels merely to discover at
# compile time that its runner has no GPU architecture.  The accelerator list
# lives in `tools/run_tests.sh`; this is everything else.
test-cpu = "bash tools/run_tests.sh cpu"
test-gpu = "bash tools/run_tests.sh gpu"
# Print the selection without running it.
test-list = "bash tools/run_tests.sh list"

# Checks docs/LIGHTGBM_PARITY.md against the repository. Standard library
# only, and it builds nothing, so it is cheap enough to run on every change.
check-parity = "python3 tools/check_parity.py"
bench = "mojo run -I src bench/bench_train.mojo"
bench-hist = "mojo run -I src bench/bench_histogram.mojo"
bench-hist-scaling = "mojo run -I src bench/bench_histogram_scaling.mojo"
bench-train-gpu = "mojo run -I src bench/bench_train_gpu.mojo"
gpu-validate = "mojo run -I src bench/bench_gpu_validation.mojo"
bench-threshold = "mojo run -I src bench/bench_threshold.mojo"
bench-sparse = "mojo run -I src bench/bench_sparse.mojo"
bench-profile = "mojo run -I src bench/bench_profile.mojo"
bench-custom = "mojo run -I src bench/bench_custom_objective.mojo"
bench-goss = "mojo run -I src bench/bench_goss.mojo"
# What one kernel launch and one host wait cost here. Read this before
# proposing any GPU change whose whole benefit is fewer launches or fewer
# synchronizations; see train_gpu.mojo's `_device_search_resident`.
bench-launch-cost = "mojo run -I src bench/bench_launch_cost.mojo"
# Calibrates the eight HybridCosts coefficients the hybrid CPU/GPU leaf
# scheduler compares (E1 in docs/design/HYBRID_TRAINING.md). Its output is
# what a `HybridCosts` constructor for this machine must cite.
bench-hybrid-costs = "mojo run -I src bench/bench_hybrid_costs.mojo"
bench-unified-memory = "mojo run -I src bench/apple/unified_memory.mojo"
build-python = "bindings/build.sh"
test-python = { cmd = "python python/test_python_api.py", depends-on = [
    "build-python",
] }
# The C ABI and the command line tool. `test-capi` and `test-cli` are Mojo
# tests and need no C toolchain; `test-c` compiles capi/test_capi.c against
# the public header and skips itself when no compiler is installed.
build-capi = "capi/build.sh"
build-cli = "cli/build.sh"
test-capi = "bash tools/run_tests.sh cpu test_capi"
test-cli = "bash tools/run_tests.sh cpu test_cli"
test-c = "capi/run_c_tests.sh"

[dependencies]
mojo = ">=1.0.0,<2"
max = ">=26.5.0,<27"

[feature.bench.dependencies]
python = ">=3.11"
numpy = "*"
lightgbm = "*"

[feature.bench.tasks]
bench-lgbm = "python bench/bench_lightgbm.py"
compare-missing = "python bench/compare_missing_lightgbm.py"
compare-categorical = "python bench/compare_categorical_lightgbm.py"
bench-custom-py = "python bench/bench_custom_objective.py"
compare-ranking = "python bench/compare_ranking.py"

[feature.pkg.dependencies]
python-build = "*"
setuptools = ">=77"
wheel = "*"
pip = "*"
twine = "*"

[feature.pkg.tasks]
build-wheel = "packaging/build_wheel.sh"
test-wheel = { cmd = "packaging/test_wheel.sh", depends-on = ["build-wheel"] }

[feature.pytest.dependencies]
pytest = "*"
scikit-learn = "*"
pandas = "*"
pyarrow = "*"
polars = "*"

# The estimator suite (python/tests) needs pytest, and its scikit-learn,
# pandas, pyarrow, and polars tests skip themselves when those are absent.
# `test-python` above stays dependency-free on purpose, so it also runs
# against a bare wheel install. Run this one with
# `pixi run -e pytest test-estimators`.
[feature.pytest.tasks]
test-estimators = { cmd = "pytest -q python/tests", depends-on = [
    "build-python",
] }

[environments]
bench = ["bench"]
pkg = ["pkg"]
pytest = ["pytest"]
