[workspace]
authors = ["Andrew Hendel <ajhendel@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojoboost"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
test = "mojo run -I src tests/test_mojoboost.mojo && mojo run -I src tests/test_metrics.mojo && mojo run -I src tests/test_weights.mojo && mojo run -I src tests/test_multiclass_model.mojo && mojo run -I src tests/test_objectives.mojo && mojo run -I src tests/test_kernels.mojo && mojo run -I src tests/test_serialize.mojo && mojo run -I src tests/test_backend_equivalence.mojo"
test-gpu = "mojo run -I src tests/test_backend_equivalence.mojo"
bench = "mojo run -I src bench/bench_train.mojo"
bench-hist = "mojo run -I src bench/bench_histogram.mojo"
build-python = "bindings/build.sh"
test-python = { cmd = "python python/test_python_api.py", depends-on = [
    "build-python",
] }

[dependencies]
mojo = ">=1.0.0,<2"
max = ">=26.5.0,<27"

[feature.bench.dependencies]
python = ">=3.11"
numpy = "*"
lightgbm = "*"

[feature.bench.tasks]
bench-lgbm = "python bench/bench_lightgbm.py"

[environments]
bench = ["bench"]
