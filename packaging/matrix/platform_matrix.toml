# Declarative release matrix for mojoboost artifacts.
#
# This file is the machine-readable half of docs/PLATFORM_MATRIX.md. The prose
# there explains the reasoning; this file is what a script may read, and
# packaging/matrix/validate_matrix.py enforces its rules.
#
# The one rule that governs everything below: `status = "validated"` is a claim
# about hardware that ran something, and it is legal only when `evidence` names
# a file that exists and records what ran. Nothing in this file may be promoted
# by editing this file alone.
#
# Nothing here has been executed. No wheel in this repository has been built by
# the change that introduced this file, and no platform below has been
# validated by it.

schema = 1
project = "mojoboost"
version = "0.1.0"

# The status vocabulary, used by every target, python row, and accelerator row.
# validate_matrix.py rejects any other word.
[vocabulary]
validated = "Hardware ran the artifact and the run is recorded in the file named by `evidence`."
tested = "CI or a local run exercised the source on this platform, but no distributable artifact was produced or installed from it."
designed = "The path is specified and believed correct, and nothing has run. No evidence, no artifact."
unsupported = "Deliberately out of scope. The failure behavior is specified in docs/PLATFORM_MATRIX.md."

# ---------------------------------------------------------------------------
# Toolchain floor
#
# Every fact in this block comes from pixi.lock, which is the only place the
# toolchain version is pinned. Change the lock, re-derive this block.
# ---------------------------------------------------------------------------
[toolchain]
mojo = "1.0.0"
max = "26.5.0"
max_build_string = "3.14release"
# max 26.5.0 depends on `python 3.14.*` and on `python-gil`. That pair, not a
# policy decision here, is what makes cp314 the only interpreter mojoboost
# builds against and what excludes the free-threaded build.
python_pin = "3.14.*"
requires_gil = true
pixi_platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
# pixi.lock's solved virtual packages. The Linux floor comes from here; it is
# what the environment was resolved against, and it is NOT a measurement of the
# shipped binaries. See rule R4 in validate_artifact.py.
solved_glibc = "2.28"
solved_macos = "13.0"
source = "pixi.lock"

# ---------------------------------------------------------------------------
# Interpreters
#
# One row, because the toolchain permits one. This is not a simplification.
# ---------------------------------------------------------------------------
[[python]]
tag = "cp314"
abi = "cp314"
version = "3.14"
status = "tested"
gil = "required"
reason = """
max 26.5.0 ships as a 3.14 build and depends on `python 3.14.*`. The extension
is compiled by the Mojo toolchain inside that environment, so the interpreter
the wheel targets is the interpreter MAX pins.
"""
evidence = ""

[[python]]
tag = "cp314t"
abi = "cp314t"
version = "3.14 free-threaded"
status = "unsupported"
gil = "absent"
reason = """
max 26.5.0 depends on `python-gil`, which the free-threaded build does not
provide. A cp314t interpreter cannot resolve the environment, so no extension
can be built for it. pip refuses the cp314 wheel on a cp314t interpreter by tag
mismatch, which is the correct failure and needs no code.
"""
evidence = ""

[[python]]
tag = "cp313"
abi = "cp313"
version = "3.13 and earlier"
status = "unsupported"
gil = "required"
reason = """
No MAX build for these interpreters in the pinned channel. `requires-python`
in python/pyproject.toml already says >=3.14, and the wheel's cp314 tag makes
pip refuse the install rather than let it fail at import.
"""
evidence = ""

[[python]]
tag = "abi3"
abi = "abi3"
version = "any"
status = "unsupported"
gil = "required"
reason = """
The extension is not built against the limited API, so there is no abi3 wheel
to ship and one interpreter series per wheel is the shape of this project until
that changes. Do not tag a wheel abi3 to widen its reach.
"""
evidence = ""

# ---------------------------------------------------------------------------
# Distributable targets
#
# `wheel_tag` is the full expected filename tag triple. Every target that
# expects a wheel names the exact string, so a build that produces a different
# one is a caught error rather than an interesting surprise.
# ---------------------------------------------------------------------------

[[target]]
id = "macos-arm64-cp314"
os = "macos"
arch = "arm64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-macosx_26_0_arm64"
filename = "mojoboost-0.1.0-cp314-cp314-macosx_26_0_arm64.whl"
status = "designed"
build_host = "Apple silicon Mac with the pinned pixi environment"
builder = "packaging/build_wheel.sh"
installer_floor = "macOS 26.0"
# The floor above is the Mojo compile step's deployment target, not a property
# of the runtime that ships inside the wheel. See `macos_floor` below and
# docs/PLATFORM_MATRIX.md, "The easy macOS wheel path".
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_macos.sh"
evidence = ""
notes = """
A wheel with this exact filename exists in python/dist in at least one working
copy, produced by an earlier local run of `pixi run build-wheel`. That is an
artifact on a disk, not a record: no clean-install run, no host provenance, and
no recorded output. Status stays `designed` until an evidence file exists.
"""

[[target]]
id = "macos-arm64-cp314-lowered"
os = "macos"
arch = "arm64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-macosx_12_0_arm64"
filename = "mojoboost-0.1.0-cp314-cp314-macosx_12_0_arm64.whl"
status = "designed"
build_host = "Apple silicon Mac with the pinned pixi environment"
builder = "packaging/build_wheel.sh with a lowered deployment target"
installer_floor = "macOS 12.0"
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_macos.sh"
evidence = ""
notes = """
The Apple product story wants a wheel that installs on the Macs people own, not
only on the newest macOS. This row is that wheel. It is a hypothesis with a
measurement behind half of it: the four bundled MAX dylibs are built for
macOS 11.0, so the runtime shipped inside the wheel does not impose the 26.0
floor; only the Mojo-compiled extension does. Whether the Mojo compiler honors
a lowered deployment target has NOT been tested. Do not create this filename
until `otool -l` on the rebuilt extension shows the lower `minos`.
"""

[[target]]
id = "macos-x86_64"
os = "macos"
arch = "x86_64"
python = "cp314"
artifact = "none"
wheel_tag = ""
filename = ""
status = "unsupported"
build_host = ""
builder = ""
installer_floor = ""
bundled_dylibs = []
smoke = ""
evidence = ""
notes = """
pixi.toml lists no osx-64 platform and the pinned channel ships no Intel macOS
toolchain, so there is nothing to build with. universal2 is unavailable for the
same reason: a fat wheel needs an x86_64 half. Intel Macs get a tag mismatch
from pip.
"""

[[target]]
id = "linux-x86_64-cp314"
os = "linux"
arch = "x86_64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-manylinux_2_28_x86_64"
filename = "mojoboost-0.1.0-cp314-cp314-manylinux_2_28_x86_64.whl"
status = "designed"
build_host = "manylinux_2_28 image, or a glibc 2.28 host with the pinned pixi environment"
builder = "does not exist yet"
installer_floor = "glibc 2.28"
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_linux.sh"
evidence = ""
notes = """
No Linux wheel builder exists. packaging/build_wheel.sh is macOS only: it calls
install_name_tool and codesign, neither of which has a Linux equivalent, and the
ELF equivalent (patchelf plus an auditwheel repair, or a hand-rolled $ORIGIN
rpath) is a different program, not a flag. The glibc floor above is the floor
pixi.lock was solved against; the floor the shipped ELF objects actually impose
has not been measured. Measure it before publishing this tag.
"""

[[target]]
id = "linux-aarch64-cp314"
os = "linux"
arch = "aarch64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-manylinux_2_28_aarch64"
filename = "mojoboost-0.1.0-cp314-cp314-manylinux_2_28_aarch64.whl"
status = "designed"
build_host = "manylinux_2_28 aarch64 image, or a glibc 2.28 ARM64 host"
builder = "does not exist yet"
installer_floor = "glibc 2.28"
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_linux.sh"
evidence = ""
notes = """
Same builder gap as x86_64, and the same unmeasured glibc floor. The bundled
library names are the macOS set with .so extensions; confirm the ELF set on the
target before trusting the list, because the Linux runtime layout has not been
inspected.
"""

[[target]]
id = "sdist"
os = "any"
arch = "any"
python = "cp314"
artifact = "none"
wheel_tag = ""
filename = ""
status = "unsupported"
build_host = ""
builder = ""
installer_floor = ""
bundled_dylibs = []
smoke = ""
evidence = ""
notes = """
No source distribution is published for the alpha. An sdist cannot build without
the Mojo toolchain, and a broken sdist is worse than no sdist: pip falls back to
it on any platform with no matching wheel and the user gets a compile error
instead of "no matching distribution found". Publish wheels only.
"""

# ---------------------------------------------------------------------------
# Source installs
#
# Not artifacts, but they are the supported way to use mojoboost today and the
# matrix is dishonest without them.
# ---------------------------------------------------------------------------

[[source_install]]
id = "src-linux-x86_64"
platform = "linux-64"
status = "tested"
how = "pixi install && pixi run test"
evidence = ".github/workflows/ci.yml, `test` and `python` jobs on ubuntu-latest"

[[source_install]]
id = "src-linux-aarch64"
platform = "linux-aarch64"
status = "tested"
how = "pixi install && pixi run test"
evidence = ".github/workflows/ci.yml, `test` and `python` jobs on ubuntu-24.04-arm"

[[source_install]]
id = "src-macos-arm64"
platform = "osx-arm64"
status = "tested"
how = "pixi install && pixi run test"
evidence = "docs/GPU_VALIDATION.md, Apple M4 record"
notes = """
Local only. ci.yml has no macOS runner on purpose: a GitHub-hosted Apple silicon
runner reports an accelerator at compile time but has no Metal toolchain, so the
GPU-touching tests cannot build there.
"""

# ---------------------------------------------------------------------------
# Accelerators
#
# The per-device detail lives in packaging/matrix/accelerators/index.toml.
# This block is only the summary and the pointer.
# ---------------------------------------------------------------------------
[accelerators]
index = "packaging/matrix/accelerators/index.toml"
record_of_truth = "docs/GPU_VALIDATION.md"
summary = """
One device has ever run this code: an Apple M4, correctness and determinism
only. Every other row in the index is not-run, including every other Apple chip.
No NVIDIA and no AMD device has executed a single kernel.
"""
