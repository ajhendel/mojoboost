# Declarative release matrix for mojotrees artifacts.
#
# This file is the machine-readable half of docs/PLATFORM_MATRIX.md. The prose
# there explains the reasoning; this file is what a script may read, and
# packaging/matrix/validate_matrix.py enforces its rules.
#
# The one rule that governs everything below: `status = "validated"` is a claim
# about hardware that ran something, and it is legal only when `evidence` names
# a file that exists and records what ran. Nothing in this file may be promoted
# by editing this file alone.
#
# Nothing here has been executed. No wheel in this repository has been built by
# the change that introduced this file, and no platform below has been
# validated by it.

schema = 1
project = "mojotrees"
version = "0.1.0a3"

# The status vocabulary, used by every target, python row, and accelerator row.
# validate_matrix.py rejects any other word.
[vocabulary]
validated = "Hardware ran the artifact and the run is recorded in the file named by `evidence`."
tested = "CI or a local run exercised the source on this platform, but no distributable artifact was produced or installed from it."
designed = "The path is specified and believed correct, and nothing has run. No evidence, no artifact."
unsupported = "Deliberately out of scope. The failure behavior is specified in docs/PLATFORM_MATRIX.md."

# ---------------------------------------------------------------------------
# Toolchain floor
#
# Every fact in this block comes from pixi.lock, which is the only place the
# toolchain version is pinned. Change the lock, re-derive this block.
# ---------------------------------------------------------------------------
[toolchain]
mojo = "1.0.0"
max = "26.5.0"
max_build_string = "3.14release"
# max 26.5.0 depends on `python-gil`, which is a real toolchain requirement and
# is what excludes every free-threaded build.
#
# The `python 3.14.*` pin beside it is NOT a toolchain requirement, and reading
# it as one was this block's bug. max 26.5.0 is published as five
# per-interpreter variants, 3.10release through 3.14release, on all three
# platforms, and pixi.toml pins no python, so the solver took the newest. cp314
# is the interpreter this project happens to build with, not the only one it
# could, and not the only one the result runs on. See docs/PYTHON_SUPPORT.md.
python_pin = "3.14.*"
requires_gil = true
# The lowest interpreter anything can reach, from two directions that agree:
# mojo 1.0.0 and mojo-python 1.0.0 both depend on `python >=3.10`, and the
# built extension aborts on 3.9 with `symbol not found: Py_NewRef`, a CPython
# 3.10 addition. Measured, docs/PYTHON_SUPPORT.md section 10.
python_toolchain_floor = "3.10"
pixi_platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
# pixi.lock's solved virtual packages. The Linux floor comes from here; it is
# what the environment was resolved against, and it is NOT a measurement of the
# shipped binaries. See rule R4 in validate_artifact.py.
solved_glibc = "2.28"
solved_macos = "13.0"
source = "pixi.lock"

# ---------------------------------------------------------------------------
# Interpreters
#
# Two different questions live in this table and they used to be conflated.
#
#   build_target   which interpreter compiles the extension and therefore
#                  decides the wheel's tag. Exactly one, from the toolchain
#                  pin, because setuptools tags a wheel for the interpreter
#                  that ran the build.
#   status         whether the *result* runs there. Many, because the
#                  extension links no libpython and resolves CPython entry
#                  points by name at runtime.
#
# The five cp310..cp314 rows below are `tested`, not `validated`: the source
# was exercised on each, on osx-arm64, but no wheel was built for any of them
# except cp314 and none was installed from. See docs/PYTHON_SUPPORT.md.
# ---------------------------------------------------------------------------
[[python]]
tag = "cp314"
abi = "cp314"
version = "3.14"
status = "tested"
gil = "required"
build_target = true
reason = """
The interpreter the pixi environment resolved to, and therefore the one the
Mojo toolchain compiles against and the one setuptools tags the wheel for. That
is a consequence of pixi.toml pinning no python, not of a toolchain
requirement: max 26.5.0 is published for 3.10 through 3.14.
"""
evidence = "docs/PYTHON_SUPPORT.md"

[[python]]
tag = "cp313"
abi = "cp313"
version = "3.13"
status = "tested"
gil = "required"
reason = """
The cp314-built extension imports and passes python/test_python_api.py here
unmodified. No wheel has been built by a 3.13 environment, so there is no
cp313 artifact; that is what keeps this row at `tested`.
"""
evidence = "docs/PYTHON_SUPPORT.md"

[[python]]
tag = "cp312"
abi = "cp312"
version = "3.12"
status = "tested"
gil = "required"
reason = """
Same run, same result. This row is also what refuted the earlier reading that
Py_GetConstantBorrowed (CPython 3.13) was a hard floor: it is in the
extension's entry point table and 3.12 runs the whole suite regardless.
"""
evidence = "docs/PYTHON_SUPPORT.md"

[[python]]
tag = "cp311"
abi = "cp311"
version = "3.11"
status = "tested"
gil = "required"
reason = """
Same run, same result.
"""
evidence = "docs/PYTHON_SUPPORT.md"

[[python]]
tag = "cp310"
abi = "cp310"
version = "3.10"
status = "tested"
gil = "required"
reason = """
Same run, same result, and this is the floor. Two independent constraints put
it here: mojo 1.0.0 and mojo-python 1.0.0 require `python >=3.10`, and the
extension aborts below it.
"""
evidence = "docs/PYTHON_SUPPORT.md"

[[python]]
tag = "cp39"
abi = "cp39"
version = "3.9 and earlier"
status = "unsupported"
gil = "required"
reason = """
The extension does not fail here, it aborts during module initialization:

    ABORT: .../std/ffi/__init__.mojo:762:18: symbol not found: Py_NewRef

Py_NewRef is a CPython 3.10 addition, and three other 3.10 additions sit in the
same entry point table. Below the toolchain's own floor as well, so there is
nothing to build with either. python/mojotrees/_compat.py refuses in front of
the import, because an abort cannot be caught.
"""
evidence = "docs/PYTHON_SUPPORT.md"

[[python]]
tag = "cp314t"
abi = "cp314t"
version = "3.14 free-threaded"
status = "unsupported"
gil = "absent"
reason = """
max 26.5.0 depends on `python-gil`, which the free-threaded build does not
provide. A free-threaded interpreter cannot resolve the environment, so no
extension can be built for it. pip refuses the cp314 wheel on a cp314t
interpreter by tag mismatch, which is the correct failure and needs no code.
Unlike every row above, this one has not been measured, because there is no
artifact to measure.
"""
evidence = ""

[[python]]
tag = "abi3"
abi = "abi3"
version = "any"
status = "unsupported"
gil = "required"
reason = """
Py_LIMITED_API is a C macro set before including Python.h, and this project has
no C source, no Python.h, and no compile step where it could be set: the
extension is emitted by `mojo build --emit shared-lib` and its CPython glue
comes from Modular's std.mojoc. setup.py has no Extension() to pass
py_limited_api to. abi3 is not a lever this repository has.

It is also not the lever it would need. abi3 exists so a binary linked against
libpython can serve several interpreters; this binary links no libpython and
already serves 3.10 through 3.14. What stands between that and one wheel is the
tag, not the ABI. Ship one wheel per interpreter. Do not tag a wheel abi3 to
widen its reach.
"""
evidence = ""

# ---------------------------------------------------------------------------
# Distributable targets
#
# `wheel_tag` is the full expected filename tag triple. Every target that
# expects a wheel names the exact string, so a build that produces a different
# one is a caught error rather than an interesting surprise.
# ---------------------------------------------------------------------------

[[target]]
id = "macos-arm64-cp314"
os = "macos"
arch = "arm64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-macosx_26_0_arm64"
filename = "mojotrees-0.1.0a3-cp314-cp314-macosx_26_0_arm64.whl"
status = "designed"
build_host = "Apple silicon Mac with the pinned pixi environment"
builder = "packaging/build_wheel.sh"
builder_script = "packaging/macos/build_release_wheel.sh"
workflow = ".github/workflows/release-macos.yml"
publishable = true
installer_floor = "macOS 26.0"
# The floor above is the Mojo compile step's deployment target, not a property
# of the runtime that ships inside the wheel. See `macos_floor` below and
# docs/PLATFORM_MATRIX.md, "The easy macOS wheel path".
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_macos.sh"
evidence = ""
notes = """
A wheel with this exact filename exists in python/dist in at least one working
copy, produced by an earlier local run of `pixi run build-wheel`. That is an
artifact on a disk, not a record: no clean-install run, no host provenance, and
no recorded output. Status stays `designed` until an evidence file exists.
"""

[[target]]
id = "macos-arm64-cp314-lowered"
os = "macos"
arch = "arm64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-macosx_12_0_arm64"
filename = "mojotrees-0.1.0a3-cp314-cp314-macosx_12_0_arm64.whl"
status = "designed"
build_host = "Apple silicon Mac with the pinned pixi environment"
builder = "packaging/build_wheel.sh with a lowered deployment target"
builder_script = "packaging/macos/build_release_wheel.sh"
workflow = ".github/workflows/release-macos.yml"
publishable = true
installer_floor = "macOS 12.0"
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_macos.sh"
evidence = ""
notes = """
The Apple product story wants a wheel that installs on the Macs people own, not
only on the newest macOS. This row is that wheel. It is a hypothesis with a
measurement behind half of it: the four bundled MAX dylibs are built for
macOS 11.0, so the runtime shipped inside the wheel does not impose the 26.0
floor; only the Mojo-compiled extension does. Whether the Mojo compiler honors
a lowered deployment target has NOT been tested. Do not create this filename
until `otool -l` on the rebuilt extension shows the lower `minos`.
"""

[[target]]
id = "macos-x86_64"
os = "macos"
arch = "x86_64"
python = "cp314"
artifact = "none"
wheel_tag = ""
filename = ""
status = "unsupported"
build_host = ""
builder = ""
builder_script = ""
workflow = ""
publishable = false
installer_floor = ""
bundled_dylibs = []
smoke = ""
evidence = ""
notes = """
pixi.toml lists no osx-64 platform and the pinned channel ships no Intel macOS
toolchain, so there is nothing to build with. universal2 is unavailable for the
same reason: a fat wheel needs an x86_64 half. Intel Macs get a tag mismatch
from pip.
"""

[[target]]
id = "linux-x86_64-cp314"
os = "linux"
arch = "x86_64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-linux_x86_64"
filename = "mojotrees-0.1.0a3-cp314-cp314-linux_x86_64.whl"
status = "designed"
build_host = "glibc 2.28 or newer x86_64 host with the pinned pixi environment"
builder = "packaging/linux/build_wheel_linux.sh, default MOJOTREES_TAG_POLICY=plain"
builder_script = "packaging/linux/build_wheel_linux.sh"
workflow = ".github/workflows/release-linux.yml"
publishable = false
installer_floor = "unmeasured; see notes"
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_linux.sh"
evidence = ""
notes = """
This row is the wheel that actually gets built. The builder defaults to
MOJOTREES_TAG_POLICY=plain and the release workflow's `tag_policy` input
defaults to `plain`, so a dispatch that accepts every default produces exactly
this filename.

It used to say `manylinux_2_28` and `builder = "does not exist yet"`, and both
were false in a way that mattered rather than a way that was merely untidy. The
builder had been written and wired into the workflow, and the manylinux tag
named a file no default build has ever produced, so validate_artifact.py failed
R1 against the real artifact: the tag matched no declared target. The matrix was
the last file still describing a Linux story the rest of the repository had
moved past. docs/INSTALLATION.md already documented this plain filename.

`publishable = false` is the honest status and not a defect. A bare linux_ tag
promises nothing about glibc and every index rejects it, which is why the
TestPyPI job in the workflow refuses to run on it. The wheel installs fine from
a file, which is what docs/INSTALLATION.md tells a user to do.

installer_floor is `unmeasured` rather than "glibc 2.28" on purpose. 2.28 is the
floor pixi.lock was solved against, which is a fact about the build environment
and not a measurement of the shipped ELF objects. The real floor is the highest
GLIBC_ symbol version any bundled object references; validate_artifact.py rule
R5f reads it and clean_install_linux.sh reads it on the target. Measuring it is
what promotes this row to linux-x86_64-cp314-manylinux.
"""

[[target]]
id = "linux-x86_64-cp314-manylinux"
os = "linux"
arch = "x86_64"
python = "cp314"
artifact = "wheel"
wheel_tag = "cp314-cp314-manylinux_2_28_x86_64"
filename = "mojotrees-0.1.0a3-cp314-cp314-manylinux_2_28_x86_64.whl"
status = "designed"
build_host = "manylinux_2_28 image, or a glibc 2.28 host with the pinned pixi environment"
builder = "packaging/linux/build_wheel_linux.sh with MOJOTREES_TAG_POLICY=manylinux"
builder_script = "packaging/linux/build_wheel_linux.sh"
workflow = ".github/workflows/release-linux.yml"
publishable = true
installer_floor = "glibc 2.28, CLAIMED AND NOT YET MEASURED"
bundled_dylibs = [
    "libKGENCompilerRTShared",
    "libAsyncRTMojoBindings",
    "libMSupportGlobals",
    "libAsyncRTRuntimeGlobals",
]
smoke = "packaging/matrix/smoke/clean_install_linux.sh"
evidence = ""
notes = """
The publishable row, and the only Linux row an index will accept. It is reached
by dispatching the workflow with tag_policy=manylinux, never by renaming the
file the plain build produced.

Nothing here has been measured. The tag is a promise that this file works on any
glibc 2.28 system, and the evidence for that promise is empty. Do not dispatch
this policy, and do not publish the result, until the GLIBC_ floor from
validate_artifact.py R5f and a clean_install_linux.sh run on a 2.28 image both
say 2.28 or lower. The builder prints a warning when this policy is selected for
the same reason.

The bundled library list is inherited from the macOS rows with a different
extension and has NOT been confirmed against a Linux build. validate_artifact.py
compares bundled_dylibs on macOS only, so nothing currently catches an error in
this list; `readelf -d` on a real build is what settles it.
"""

