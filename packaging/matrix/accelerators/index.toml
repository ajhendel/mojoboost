# Accelerator evidence index.
#
# One row per device we would claim anything about. Every row starts at
# `not-run` and moves only when a record exists, in the format the templates in
# this directory define, holding output somebody watched print.
#
# docs/GPU_VALIDATION.md is the record of truth; this file is its index, so a
# row here can never be ahead of what that document contains. The rule
# validate_matrix.py enforces: any status other than `not-run` requires a
# non-empty `record`, and any row claiming `validated` requires all four of
# correctness, determinism, phase_timings, and profiler to be `pass`.
#
# The chip list is a fill-in target, not a support claim. A row existing here
# says the device is worth recording, not that it works, not that MAX supports
# it, and not that anyone owns one.

schema = 1
record_of_truth = "docs/GPU_VALIDATION.md"

[vocabulary]
"not-run" = "Nothing has executed on this device. The default, and the only honest state without a record."
partial = "Some of the six validation steps ran and are recorded. The per-step columns say which."
validated = "All four recorded columns pass and the record names the host, the driver, and the toolchain."
unsupported = "The build or the runtime refuses this device, and the refusal is recorded."

[steps]
correctness = "GPU histograms and GPU-trained models agree with the CPU reference inside the documented Float32 tolerance; integer counts agree exactly."
determinism = "Repeat runs are bit-identical, and the two accumulation strategies agree bit-identically."
phase_timings = "A recorded `pixi run gpu-validate` sweep across several shapes, with training MSE next to every throughput number."
profiler = "Occupancy, shared-memory limiter, bank conflicts, and atomic traffic read off a real trace and compared against the harness predictions."

# ---------------------------------------------------------------------------
# Apple, Metal
#
# `template` is packaging/matrix/accelerators/TEMPLATE_apple.md.
#
# What every Apple row must record beyond the common block, because these are
# the numbers the tiling policy depends on and they are the ones that differ
# across the family: `max_shared_memory_per_block`, `multiprocessor_count`,
# `max_threads_per_block`, and which of the eleven device attributes the
# backend refuses. On the M4 that refusal list is six long; assume nothing
# about the others.
# ---------------------------------------------------------------------------

[[device]]
id = "apple-m1"
vendor = "apple"
chip = "M1"
api = "metal"
status = "not-run"
correctness = "not-run"
determinism = "not-run"
phase_timings = "not-run"
profiler = "not-run"
record = ""
template = "packaging/matrix/accelerators/TEMPLATE_apple.md"

