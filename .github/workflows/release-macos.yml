# macOS arm64 wheel release.
#
# NOT EXECUTED. This workflow has never run, and as committed it cannot: every
# third-party action below says `@REPLACE_WITH_SHA`, which is not a ref, and the
# runner it targets does not exist yet. Both are deliberate and both are
# resolved in handoffs/release_02_macos_wheels.md.
#
# Why the pins are placeholders. Pinning an action to a tag means running
# whatever that tag points at when the job starts, and this workflow holds an
# OIDC identity that can publish to a package index. The lane that wrote it had
# no network access, so the choice was a fabricated hash that looks right and is
# wrong, or an obvious hole that fails loudly. It is the hole, in the same
# spelling .github/workflows/release-provenance.yml uses, so one command fills
# in both. packaging/macos/check_action_pins.py rejects the placeholder and
# prints the command that resolves each one. The trailing comment on each line
# is the version the hash must correspond to; resolving it is not a matter of
# taking the newest release.
#
# Why the runner is self-hosted. `has_accelerator()` is resolved at compile time
# (src/mojoboost/device.mojo), so the machine that builds the wheel decides what
# the wheel says about GPUs on every machine that installs it. A GitHub-hosted
# Apple silicon runner reports an accelerator and has no Metal toolchain, so it
# produces exactly the artifact nobody can reason about: a wheel that claims a
# GPU, built where the GPU sources could not be compiled or tested. See the
# comment at the top of .github/workflows/ci.yml, which is why CI has no macOS
# runner at all. packaging/macos/provenance.sh refuses that combination.
#
#   runner labels expected:
#     [self-hosted, macos, arm64, metal]
#       an Apple silicon Mac with Xcode, the Metal toolchain, a Python 3.14 that
#       did not come from this repository's pixi environment, and no `mojo` on
#       the runner account's PATH. The last one is a requirement of the
#       clean-install fixture, which refuses to certify a wheel next to the
#       toolchain the wheel must not need.
#
# What this workflow does not do: publish to PyPI. There is no production
# publish job, not a disabled one. Promoting the identical artifact from
# TestPyPI to PyPI is an owner procedure and it belongs to docs/PYPI_RELEASE.md.
#
# UNRESOLVED, AND IT HAS TO BE RESOLVED BEFORE EITHER WORKFLOW PUBLISHES.
# .github/workflows/release-provenance.yml, added in the same round, contains a
# macOS build job with the same runner labels and its own publish jobs for both
# TestPyPI and PyPI. A trusted publisher is bound to a workflow filename and an
# environment name, so the two files are two publisher identities, and
# docs/PYPI_RELEASE.md currently tells the owner to register the one belonging
# to that file. Configuring both widens the publishing surface for no gain;
# configuring one and dispatching the other fails at upload with a token the
# index will not accept. The choice, and what to delete either way, is in
# "Cross-lane reconciliation" in handoffs/release_02_macos_wheels.md.

name: Release macOS wheel

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build, for example v0.1.0. Must already exist.
        required: true
        type: string
      runner:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["self-hosted","macos","arm64","metal"]'
      macos_deployment_target:
        description: >-
          macOS deployment target for the extension, for example 12.0. Empty
          means the SDK default, which today produces a macosx_26_0 tag.
        required: false
        type: string
        default: ""
      publish_testpypi:
        description: Publish the built wheel to TestPyPI after every check passes
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

# Least privilege by default. Each job re-grants only what it needs, and only
# the TestPyPI job gets an OIDC token.
permissions: {}

# One release per tag at a time. `github.ref_name` rather than `github.ref` so a
# dispatch (which passes `v0.1.0`) and a tag push (whose ref is
# `refs/tags/v0.1.0`) land in the same group instead of running side by side and
# racing on the artifact names.
concurrency:
  group: release-macos-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify (macOS arm64)
    # On a push of a tag there are no inputs, so the expression falls back to
    # the default label set. Confirm that fallback on the first tag push; it is
    # the one line here that behaves differently between the two triggers.
    runs-on: ${{ fromJSON(inputs.runner || '["self-hosted","macos","arm64","metal"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      wheel: ${{ steps.identify.outputs.wheel }}
      sha256: ${{ steps.identify.outputs.sha256 }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@REPLACE_WITH_SHA # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          # A build job has no business holding a token that can write to this
          # repository, and a self-hosted runner keeps the checkout's git
          # credentials on a disk somebody else may use.
          persist-credentials: false

      - name: Actions are pinned to commit hashes
        run: python3 packaging/macos/check_action_pins.py

      # Before the toolchain, because a 90 minute build on the wrong machine is
      # a wasted 90 minutes and a wheel that has to be thrown away.
      - name: Runner is a native Apple silicon Mac
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 0
          sw_vers
          xcodebuild -version
          # Recorded, not required here: packaging/macos/provenance.sh decides
          # what an absent Metal toolchain means, together with the build's
          # compile-time accelerator answer.
          xcrun --find metal || echo "metal toolchain: absent"
          xcrun metal --version 2>&1 | head -1 || true
          # The clean-install fixture refuses to run with `mojo` on PATH, and it
          # is right to. Failing here says so before the build rather than after.
          if command -v mojo >/dev/null 2>&1; then
            echo "mojo is on this runner's PATH ($(command -v mojo))." >&2
            echo "The clean-install step cannot prove anything on this machine." >&2
            exit 1
          fi
          command -v "${RELEASE_PYTHON}" >/dev/null 2>&1 || {
            echo "no ${RELEASE_PYTHON} on PATH. The clean-install fixture needs a" >&2
            echo "Python 3.14 that did not come from this repository's pixi env." >&2
            exit 1
          }
        env:
          RELEASE_PYTHON: python3.14

      - name: The commit is a tag and the tag matches the version
        id: commit
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -1)
          tag=$(git describe --exact-match --tags HEAD)
          test "$tag" = "v$version"
          test -z "$(git status --porcelain)"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          # Recorded rather than enforced. Requiring a signed tag is an owner
          # decision that belongs with the rest of the release security posture
          # in docs/RELEASE_SECURITY.md, not a rule this lane invents.
          echo "tag object:"
          git cat-file -p "$tag" | head -20

      - uses: prefix-dev/setup-pixi@REPLACE_WITH_SHA # v0.10.1
        with:
          cache: true
          environments: default pkg

      - name: Toolchain versions
        run: |
          pixi run mojo --version
          pixi list --environment default | grep -Ei '^(mojo|max|python) ' || true
          shasum -a 256 pixi.lock

      # One script, so that a release run and a run on a laptop are the same
      # thing. It builds and tests through `pixi run -e pkg test-wheel`, writes
      # the provenance sidecar, and then runs three checkers: the matrix
      # contract, the artifact against the matrix, and the release-only rules.
      # All three run even when one fails, so a failing release still uploads
      # the reports that say why.
      - name: Build, verify, and hash
        env:
          MOJOBOOST_MACOS_TARGET: ${{ inputs.macos_deployment_target }}
        run: packaging/macos/build_release_wheel.sh

      - name: Identify the artifact
        id: identify
        run: |
          set -euo pipefail
          wheel=$(ls python/dist/mojoboost-*.whl)
          echo "wheel=$(basename "$wheel")" >>"$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$wheel" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          {
            echo "### macOS arm64 wheel"
            echo
            echo '```'
            cat python/dist/SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Outside pixi on purpose, and the only step here that says anything about
      # a machine without the toolchain. `env -u CONDA_PREFIX` is necessary and
      # not sufficient: the fixture also refuses if `mojo` is on PATH, which the
      # runner check above already covered.
      #
      # The log path is absolute because it has to be. The fixture makes the
      # wheel path absolute and then `cd`s into a temp directory, but it leaves
      # the record path as given, so a relative one is written relative to a
      # directory that does not contain it. That is a note for whoever owns
      # packaging/matrix, not something this lane changes.
      - name: Clean install on a toolchain-free environment
        env:
          PYTHON: python3.14
        run: |
          env -u CONDA_PREFIX PYTHON="$PYTHON" \
            bash packaging/matrix/smoke/clean_install_macos.sh \
              "$(ls python/dist/mojoboost-*.whl)" \
              "$PWD/python/dist/clean-install.txt"

      # The manifest is written by the build script, before the clean-install
      # step exists to be hashed. Re-running it here covers the record too, and
      # leaves the wheel's line byte-identical, which is what the publish job
      # greps for.
      - name: Re-hash, including the clean install record
        if: always()
        run: |
          test -d python/dist || { echo "no python/dist, nothing to hash"; exit 0; }
          packaging/macos/hash_artifacts.sh python/dist

      # Two artifacts, because the publish job must receive the wheel and only
      # the wheel: twine uploads everything in the directory it is given.
      #
      # The names `wheel` and `release-metadata` are not descriptive by
      # accident. They are the names .github/workflows/release-provenance.yml
      # (lane 10) downloads, so its attestation and publish jobs can consume
      # this build without an edit if the integrator keeps one macOS build job
      # rather than two. See "Cross-lane reconciliation" in
      # handoffs/release_02_macos_wheels.md, which is where that decision
      # belongs.
      - name: Upload the wheel
        uses: actions/upload-artifact@REPLACE_WITH_SHA # v4.4.3
        with:
          name: wheel
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 90

      - name: Upload the release evidence
        if: always()
        uses: actions/upload-artifact@REPLACE_WITH_SHA # v4.4.3
        with:
          name: release-metadata
          path: |
            python/dist/*.provenance.json
            python/dist/SHA256SUMS
            python/dist/inspection.json
            python/dist/otool.txt
            python/dist/clean-install.txt
          if-no-files-found: warn
          retention-days: 90

  # Opt in, per run, and never on a tag push. A release that publishes because a
  # tag was pushed is a release nobody decided to make.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment is where the owner puts a required reviewer and
    # restricts which tags may deploy. The name must exist in repository
    # settings before this job can run; creating it is an owner step in the
    # handoff.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mojoboost/
    permissions:
      # The whole reason trusted publishing needs no API token: a short-lived
      # OIDC token minted for this job, exchanged with TestPyPI for an upload
      # credential that expires. Nothing here reads or writes repository
      # contents.
      id-token: write
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@REPLACE_WITH_SHA # v4.1.8
        with:
          name: wheel
          path: dist

      - name: Download the evidence
        uses: actions/download-artifact@REPLACE_WITH_SHA # v4.1.8
        with:
          name: release-metadata
          path: evidence

      # The artifact that arrives here is not, by construction, the artifact
      # that was built: it made a round trip through artifact storage. Compare
      # it against both the build job's output and the manifest the build
      # signed off on, before handing it to anything that can publish.
      #
      # The two values from the build job arrive as environment variables rather
      # than as `${{ }}` inside the script. They are hashes and a filename this
      # workflow computed itself, so nothing here is attacker controlled today,
      # but a job that holds an OIDC token should not have expression results
      # spliced into a shell at all.
      - name: The wheel is the one that was built
        env:
          EXPECTED_WHEEL: ${{ needs.build.outputs.wheel }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          count=$(find dist -type f | wc -l | tr -d ' ')
          test "$count" = 1
          wheel=$(find dist -type f -name '*.whl')
          test "$(basename "$wheel")" = "$EXPECTED_WHEEL"
          actual=$(sha256sum "$wheel" | cut -d' ' -f1)
          test "$actual" = "$EXPECTED_SHA256"
          grep -qF "$actual  $EXPECTED_WHEEL" evidence/SHA256SUMS
          echo "sha256 $actual matches the build output and SHA256SUMS"

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@REPLACE_WITH_SHA # v1.12.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          print-hash: true
          # A filename collision means this exact version was already uploaded.
          # Skipping it quietly is how two different artifacts end up believed
          # to be the same one.
          skip-existing: false

      - name: What to compare on the index
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "TestPyPI shows a sha256 for the uploaded file. It must equal:"
          echo "  $EXPECTED_SHA256"
          echo "The commands to check that from a clean machine are in"
          echo "handoffs/release_02_macos_wheels.md."
