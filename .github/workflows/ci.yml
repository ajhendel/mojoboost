name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# macOS runners are intentionally absent: Apple-silicon runners report an
# accelerator at compile time but lack the Metal toolchain, so the GPU
# equivalence test cannot build there. osx-arm64 is validated locally.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
      # Almost all of a suite run's wall clock is `mojo` compiling, not tests
      # executing: measured on this tree, one test file costs about 1.6 s of
      # cold compile and under a millisecond of tests, and the harness now
      # prints both numbers side by side so the two cannot be confused
      # (docs/design/TEST_HARNESS_COST.md). Mojo's content-addressed compile
      # cache is worth 5.4x on a warm file, and `setup-pixi` does not carry
      # it: that action keys on the lockfile and saves the environment right
      # after install, before anything has been compiled, so every run
      # without this step is fully cold.
      - name: Mojo compile cache
        uses: actions/cache@v4
        with:
          path: .pixi/envs/default/share/max/cache
          key: mojo-cache-${{ matrix.runner }}-${{ hashFiles('pixi.lock') }}-${{ hashFiles('src/**/*.mojo', 'tests/**/*.mojo') }}
          restore-keys: |
            mojo-cache-${{ matrix.runner }}-${{ hashFiles('pixi.lock') }}-
            mojo-cache-${{ matrix.runner }}-
      - id: cpus
        run: echo "count=$(nproc)" >> "$GITHUB_OUTPUT"
      # The runner defaults to two fewer jobs than the CPU count so a suite
      # run leaves a development machine usable. A CI runner has nothing else
      # to do, so give it everything.
      - name: Run CPU tests
        run: pixi run test-cpu
        env:
          MOJOTREES_TEST_JOBS: ${{ steps.cpus.outputs.count }}

  # The Python API: the dependency-free suite in the default environment,
  # then the estimator suite with pytest, scikit-learn, and pandas. Both
  # build the extension module first (test-python and test-estimators
  # depend on build-python).
  python:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
          environments: default pytest
      - name: Python API tests
        run: pixi run test-python
      - name: Estimator tests
        run: pixi run -e pytest test-estimators

  # The LightGBM parity contract. Standard library only and no build, so it
  # runs on a bare runner in seconds and fails when a supported row, a cited
  # file, or a named public symbol disappears.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parity contract
        run: python3 tools/check_parity.py

  # The public API snapshot. Same shape as `parity` and for the same reason:
  # standard library only, `tomllib` and `ast` over files already in the
  # tree, nothing built, nothing installed, seconds on a bare runner.
  #
  # This job is new because its absence was doing damage. `check_parity` ran
  # on every push and the snapshot check ran nowhere, so snapshot drift was
  # invisible until somebody regenerated by hand, and then a single
  # regeneration swept in unrelated drifts that other changes had introduced
  # without regenerating. Running --check on every push means each change
  # carries its own snapshot update, attributed to the change that caused it.
  #
  # On failure, regenerate with `python3 tools/api_snapshot.py --write` and
  # read the classification it prints before committing the result: the
  # script labels a diff breaking, review, or additive, and a breaking line
  # is a decision rather than a regeneration.
  api-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API snapshot
        run: python3 tools/api_snapshot.py --check

  # pixi.toml against the tree: a task naming a file that is gone, a
  # depends-on naming no task, an environment naming no feature. Each of
  # those fails at `pixi run` time on somebody else's machine for a reason
  # unrelated to what they changed. Reading the manifest costs nothing.
  pixi-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pixi task manifest
        run: python3 tools/check_pixi_tasks.py

  # Informational only. Logs the reachable-surface report so a lane's claim
  # that its audit section improved can be checked from the PR. Non-blocking
  # until docs/INTEGRATION_INVENTORY.md is caught up.
  connectivity-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Connectivity audit
        run: python3 tools/connectivity_audit.py
      - name: Integration inventory audit
        run: python3 tools/audit_integration.py

  # Manual benchmark profiles (workflow_dispatch) on x86-64 and ARM64.
  # lscpu flags show whether the x86 runner has avx2/avx512f, which is the
  # input for any future width-specific fast path.
  bench:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
      - name: CPU info
        run: lscpu | grep -iE 'model name|architecture|^flags' || true
      - name: Histogram benchmark
        run: pixi run bench-hist 200000 100 10
      - name: Multicore threshold sweep
        run: pixi run bench-threshold
